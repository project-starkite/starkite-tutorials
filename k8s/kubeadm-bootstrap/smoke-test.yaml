apiVersion: v1
kind: Namespace
metadata:
  name: platform-smoke-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: platform-smoke-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      containers:
        - name: web
          image: registry.k8s.io/e2e-test-images/agnhost:2.40
          command: ["/agnhost", "netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api-svc
  namespace: platform-smoke-test
spec:
  type: ClusterIP
  selector:
    app: demo-api
  ports:
    - port: 80
      targetPort: 8080
