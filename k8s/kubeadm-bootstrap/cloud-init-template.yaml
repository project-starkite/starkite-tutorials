# Lima machine specification template
# Node: {{.node}}
base:
  - "template:ubuntu-24.04"
cpus: {{.cpus}}
memory: "{{.memory_gb}}GiB"
disk: "{{.disk_gb}}GiB"
networks:
  - lima: user-v2
containerd:
  system: false
  user: false
provision:
  - mode: data
    path: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    owner: "root:root"
    permissions: "0644"
  - mode: data
    path: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
    owner: "root:root"
    permissions: "0644"
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail

      # 1. OS kernel runtime activation
      swapoff -a
      sed -i '/swap/d' /etc/fstab
      modprobe overlay
      modprobe br_netfilter
      sysctl --system

      # 2. Containerd runtime
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -qq
      apt-get install -y -qq containerd
      mkdir -p /etc/containerd
      containerd config default > /etc/containerd/config.toml
      sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
      systemctl restart containerd
      systemctl enable containerd

      # 3. Kubernetes packages
      mkdir -p -m 755 /etc/apt/keyrings
      curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{.k8s_version}}/deb/Release.key | gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{.k8s_version}}/deb/ /' > /etc/apt/sources.list.d/kubernetes.list
      apt-get update -qq
      apt-get install -y -qq kubelet kubeadm kubectl
      apt-mark hold kubelet kubeadm kubectl
      systemctl enable kubelet
