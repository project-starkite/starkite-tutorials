apiVersion: v1
kind: Namespace
metadata:
  name: init-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-api-sa
  namespace: init-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: payment-api-config-reader
  namespace: init-demo
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: payment-api-config-reader-binding
  namespace: init-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: payment-api-config-reader
subjects:
  - kind: ServiceAccount
    name: payment-api-sa
    namespace: init-demo
---
apiVersion: v1
data:
  DB_HOST: postgres.internal.svc.cluster.local
  DB_PORT: "5432"
  RATE_LIMIT_RPS: "250"
  TLS_MODE: strict
kind: ConfigMap
metadata:
  name: payment-api-settings
  namespace: init-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: payment-api
  name: payment-api
  namespace: init-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
        - args:
            - |
              #!/usr/bin/env kite

              def main():
                  cfg = fs.read_text("/etc/payment-api/runtime-config.json")
                  sha = fs.read_text("/etc/payment-api/runtime-config.sha256")
                  print(cfg)
                  print(sha)
                  http.serve({"GET /": lambda req: {"status": 200, "headers": {"Content-Type": "application/json"}, "body": cfg}}, port=8080)
            - --sandbox-path-read=/etc/payment-api
            - --sandbox-net-allow
          command:
            - kite
            - eval
          image: ghcr.io/project-starkite/starkite:v0.11.8
          name: payment-api
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/payment-api
              name: shared-config
              readOnly: true
      initContainers:
        - args:
            - |
              #!/usr/bin/env kite

              REQUIRED_KEYS = ["DB_HOST", "DB_PORT", "RATE_LIMIT_RPS", "TLS_MODE"]

              def validate_keys(data):
                  return [k for k in REQUIRED_KEYS if not data.get(k)]

              def render_config(ns, data):
                  return {
                      "service": "payment-api",
                      "namespace": ns,
                      "database": {
                          "host": data["DB_HOST"],
                          "port": int(data["DB_PORT"]),
                          "tls_mode": data["TLS_MODE"],
                      },
                      "limits": {
                          "rps": int(data["RATE_LIMIT_RPS"]),
                      },
                  }

              def main():
                  ns = "init-demo"
                  out = fs.path("/etc/payment-api")

                  k = k8s.config(namespace=ns)
                  cm = k.get("configmap", "payment-api-settings")

                  data = cm.get("data", {})
                  missing = validate_keys(data)
                  if missing:
                      fail("missing required keys: %s" % ", ".join(missing))

                  payload = json.encode(render_config(ns, data))
                  out.mkdir(parents=True)
                  (out / "runtime-config.json").write_text(payload)
                  (out / "runtime-config.sha256").write_text(hash.text(payload).sha256() + "  runtime-config.json\n")
            - --sandbox-path-read=/var/run/secrets/kubernetes.io/serviceaccount
            - --sandbox-path-write=/etc/payment-api
            - --sandbox-net-allow
            - --env=KUBERNETES_SERVICE_HOST
            - --env=KUBERNETES_SERVICE_PORT
          command:
            - kite
            - eval
          image: ghcr.io/project-starkite/starkite:v0.11.8
          name: config-bootstrap
          volumeMounts:
            - mountPath: /etc/payment-api
              name: shared-config
      serviceAccountName: payment-api-sa
      volumes:
        - emptyDir: {}
          name: shared-config

