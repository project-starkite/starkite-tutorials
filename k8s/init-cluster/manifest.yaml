apiVersion: v1
kind: Namespace
metadata:
  name: init-demo
---
apiVersion: v1
automountServiceAccountToken: true
kind: ServiceAccount
metadata:
  name: payment-api-sa
  namespace: init-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: payment-api-config-reader
  namespace: init-demo
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: payment-api-config-reader-binding
  namespace: init-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: payment-api-config-reader
subjects:
  - kind: ServiceAccount
    name: payment-api-sa
    namespace: init-demo
---
apiVersion: v1
data:
  DB_HOST: postgres.internal.svc.cluster.local
  DB_PORT: "5432"
  RATE_LIMIT_RPS: "250"
  TLS_MODE: strict
kind: ConfigMap
metadata:
  name: payment-api-settings
  namespace: init-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: payment-api
  name: payment-api
  namespace: init-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
        - command:
            - sh
            - -c
            - cat /etc/payment-api/runtime-config.json && echo '' && cat /etc/payment-api/runtime-config.sha256 && sleep 3600
          image: busybox:1.37
          name: payment-api
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - mountPath: /etc/payment-api
              name: shared-config
              readOnly: true
      initContainers:
        - args:
            - |
              def main():
                  k = k8s.config(namespace="init-demo")
                  cm = retry.with_backoff(lambda: k.try_get("configmap", "payment-api-settings"), max_attempts=5, delay="300ms")
                  if not cm.ok:
                      fail("configmap unavailable: %s" % cm.error)
                  data = cm.value.get("data", {})
                  missing = [k for k in ["DB_HOST", "DB_PORT", "RATE_LIMIT_RPS", "TLS_MODE"] if not data.get(k)]
                  if missing:
                      fail("missing required keys: %s" % ", ".join(missing))
                  payload = json.encode({
                      "service": "payment-api",
                      "namespace": "init-demo",
                      "database": {"host": data["DB_HOST"], "port": int(data["DB_PORT"]), "tls_mode": data["TLS_MODE"]},
                      "limits": {"rps": int(data["RATE_LIMIT_RPS"])},
                  })
                  out = fs.path("/work/shared")
                  out.mkdir(parents=True)
                  (out / "runtime-config.json").write_text(payload)
                  (out / "runtime-config.sha256").write_text(hash.text(payload).sha256() + "  runtime-config.json\n")
            - --sandbox-path-read=/var/run/secrets/kubernetes.io/serviceaccount
            - --sandbox-path-write=/work/shared
            - --sandbox-net-allow
            - --env=KUBERNETES_SERVICE_HOST
            - --env=KUBERNETES_SERVICE_PORT
          command:
            - kite
            - eval
          image: ghcr.io/project-starkite/starkite:v0.11.8
          name: config-bootstrap
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 25m
              memory: 32Mi
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - mountPath: /work/shared
              name: shared-config
      serviceAccountName: payment-api-sa
      volumes:
        - emptyDir: {}
          name: shared-config

